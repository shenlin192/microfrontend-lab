name: Deploy Shell

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI run ID with a successful Build shell job from a push to main'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Let an active upload finish before starting another Shell deployment.
concurrency:
  group: deploy-shell-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shell to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - name: Set up Node.js for the deployment CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Verify the selected CI source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "CI run ID must be a number."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" | jq -er --arg repository "$GITHUB_REPOSITORY" '
            if .path == ".github/workflows/ci.yml"
              and .event == "push" and .head_branch == "main"
              and .head_repository.full_name == $repository
            then "commit=\(.head_sha)"
            else error("Select a CI run from a push to main in this repository.")
            end
          ' >> "$GITHUB_OUTPUT"

      # Other apps may still be running or may have failed.
      - name: Verify only Shell's build job
        id: shell
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?filter=latest&per_page=100" | jq -er --arg commit "$SOURCE_COMMIT" '
            [.jobs[] | select(.name == "Build shell" and .head_sha == $commit)] |
            if length == 1 and .[0].status == "completed" and .[0].conclusion == "success"
            then "artifact=shell-\($commit)-\(.[0].run_attempt)"
            else error("The selected run must contain a completed, successful Build shell job.")
            end
          ' >> "$GITHUB_OUTPUT"

      - name: Download the exact Shell artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.shell.outputs.artifact }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: shell-dist

      - name: Deploy the artifact without rebuilding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.136.3 pages deploy shell-dist --project-name=microfrontend-lab-shell --branch=main --commit-hash="$SOURCE_COMMIT"

      - name: Record deployment
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT_NAME: ${{ steps.shell.outputs.artifact }}
        run: |
          {
            echo "### Shell deployment"
            echo "Commit: $SOURCE_COMMIT"
            echo "CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
            echo "Artifact: $ARTIFACT_NAME"
            echo "URL: https://microfrontend-lab-shell.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
