name: Deploy Shell

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published shell version, for example 1.0.0 (without v)'
        required: true
        type: string

permissions:
  contents: read

# Let an active upload finish before starting another Shell deployment.
concurrency:
  group: deploy-shell-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Shell to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      APP: shell
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set up Node.js for the deployment CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Download and verify the selected release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a published version such as 1.0.0, without v."
            exit 1
          fi
          TAG="$APP/v$VERSION"
          gh api "repos/$GH_REPO/releases/tags/$TAG" | jq -e '
            .draft == false and .prerelease == false and .immutable == true
          '
          gh release download "$TAG" --pattern "$APP.tar.gz" --pattern release.json --dir release
          COMMIT=$(jq -er --arg app "$APP" --arg version "$VERSION" --arg tag "$TAG" '
            if .app == $app and .version == $version and .tag == $tag
              and (.commit | test("^[0-9a-f]{40}$")) and (.sha256 | test("^[0-9a-f]{64}$"))
            then .commit else error("Release metadata does not match the selected app/version.") end
          ' release/release.json)
          cd release
          printf '%s  %s\n' "$(jq -r .sha256 release.json)" "$APP.tar.gz" | sha256sum --check
          mkdir ../app-dist
          tar -xzf "$APP.tar.gz" -C ../app-dist
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Deploy the artifact without rebuilding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.136.3 pages deploy app-dist --project-name=microfrontend-lab-shell --branch=main --commit-hash="$SOURCE_COMMIT"

      - name: Record deployment
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          {
            echo "### Shell deployment"
            echo "Commit: $SOURCE_COMMIT"
            echo "Release: https://github.com/$GH_REPO/releases/tag/$APP/v$VERSION"
            echo "URL: https://microfrontend-lab-shell.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
