name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all apps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_CATALOG_ENTRY: ${{ vars.VITE_CATALOG_ENTRY || 'http://localhost:4101/remoteEntry.js' }}
      VITE_ORDERS_ENTRY: ${{ vars.VITE_ORDERS_ENTRY || 'http://localhost:4102/remoteEntry.js' }}
      VITE_SHELL_URL: ${{ vars.VITE_SHELL_URL || 'http://localhost:4100/' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      # Reads the pnpm version from package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shell, Catalog, and Orders
        run: pnpm build

      - name: Save Catalog release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/catalog/dist
          if-no-files-found: error
          retention-days: 30
