name: Deploy composition

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      shell_version:
        type: string
        required: true
      catalog_version:
        type: string
        required: true
      orders_version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-shell-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELL_VERSION: ${{ inputs.shell_version }}
      CATALOG_VERSION: ${{ inputs.catalog_version }}
      ORDERS_VERSION: ${{ inputs.orders_version }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.target == 'production' && 'main' || 'preview' }}
    steps:
      - name: Check out the deployment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Download the shell release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "shell/v$SHELL_VERSION" --pattern shell.tar.gz --pattern release.json --dir release
          cd release
          printf '%s  %s\n' "$(jq -r .sha256 release.json)" shell.tar.gz | sha256sum --check
          mkdir ../app-dist
          tar -xzf shell.tar.gz -C ../app-dist
          echo "commit=$(jq -r .commit release.json)" >> "$GITHUB_OUTPUT"

      - name: Select the Catalog and Orders versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-remotes.mjs "$CATALOG_VERSION" "$ORDERS_VERSION" app-dist/remotes.json

      - name: Deploy the selected composition
        id: deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          npx --yes wrangler@4.136.3 pages deploy app-dist --project-name=microfrontend-lab-shell \
            --branch="$BRANCH" --commit-hash="$SOURCE_COMMIT"
          URL=$(jq -sr 'map(select(.type == "pages-deploy")) | last.url' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Show the selected versions and URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          {
            echo "Shell $SHELL_VERSION · Catalog $CATALOG_VERSION · Orders $ORDERS_VERSION"
            echo "Deployment: $DEPLOYMENT_URL"
            if [ "$BRANCH" = main ]; then echo "Production: https://microfrontend-lab-shell.pages.dev"; fi
          } >> "$GITHUB_STEP_SUMMARY"
