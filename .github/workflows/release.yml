name: Release app

on:
  push:
    tags: ['catalog/v*', 'orders/v*', 'shell/v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VITE_SHELL_STANDALONE_FALLBACK_URL: ${{ vars.VITE_SHELL_STANDALONE_FALLBACK_URL }}
    steps:
      - name: Read the app and version from the tag
        shell: bash
        run: |
          # A tag selects both the app and its release version.
          [[ "$TAG" =~ ^(catalog|orders|shell)/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "APP=${TAG%%/*}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#*/v}" >> "$GITHUB_ENV"

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only the tagged app
        # Keep the Actions summary focused on the release rather than Nx performance stats.
        run: GITHUB_STEP_SUMMARY='' pnpm nx build "$APP"

      - name: Publish the build without deploying
        shell: bash
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          tar -czf "$APP.tar.gz" -C "apps/$APP/dist" .
          DIGEST=$(sha256sum "$APP.tar.gz" | cut -d ' ' -f 1)
          jq -n --arg app "$APP" --arg version "$VERSION" \
            --arg commit "$SOURCE_COMMIT" --arg sha256 "$DIGEST" \
            '{app: $app, version: $version, commit: $commit, sha256: $sha256}' > release.json
          # gh uploads the assets to a draft, then publishes it automatically.
          gh release create "$TAG" "$APP.tar.gz" release.json --verify-tag \
            --title "$TAG" --latest=false \
            --notes "Deploy version $VERSION using this app's manual deployment workflow."
          {
            echo "### Released $TAG"
            echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
