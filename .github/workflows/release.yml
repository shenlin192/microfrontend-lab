name: Release app

on:
  push:
    tags: ['catalog/v*', 'orders/v*', 'shell/v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VITE_SHELL_URL: ${{ vars.VITE_SHELL_URL || 'http://localhost:4100/' }}
    steps:
      - name: Read the app and version from the tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^(catalog|orders|shell)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a tag such as catalog/v1.2.0."
            exit 1
          fi
          echo "APP=${TAG%%/*}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#*/v}" >> "$GITHUB_ENV"

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only the tagged app
        run: pnpm nx build "$APP"

      - name: Freeze the shell's selected remote configuration
        if: env.APP == 'shell'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-remotes.mjs config/remotes.production.json apps/shell/dist/remotes.json

      - name: Publish the build without deploying
        shell: bash
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          tar -czf "$APP.tar.gz" -C "apps/$APP/dist" .
          DIGEST=$(sha256sum "$APP.tar.gz" | cut -d ' ' -f 1)
          REMOTES='{}'
          if [ "$APP" = shell ]; then REMOTES=$(cat apps/shell/dist/remotes.json); fi
          jq -n --arg app "$APP" --arg version "$VERSION" --arg tag "$TAG" \
            --arg commit "$SOURCE_COMMIT" --arg run "$GITHUB_RUN_ID" --arg sha256 "$DIGEST" \
            --argjson remotes "$REMOTES" \
            '{app: $app, version: $version, tag: $tag, commit: $commit,
              buildRunId: $run, sha256: $sha256}
              + (if $app == "shell" then {remotes: $remotes} else {} end)' > release.json
          # gh uploads the assets to a draft, then publishes it automatically.
          gh release create "$TAG" "$APP.tar.gz" release.json --verify-tag \
            --title "$TAG" --latest=false \
            --notes "Deploy version $VERSION using this app's manual deployment workflow."
          {
            echo "### Released $TAG"
            echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
