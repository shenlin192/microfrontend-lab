name: Shell pipeline
on:
  push:
    branches: [main]
    paths:
      - 'apps/shell/**'
      - 'packages/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/_frontend.yml'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'apps/shell/**'
      - 'packages/**'
      - 'package*.json'
      - 'scripts/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'playwright.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    uses: ./.github/workflows/_frontend.yml
    with:
      app: shell
    secrets: inherit
