name: Roll back cloud remote
on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        required: true
        options: [catalog, orders]
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.app }}-refs/heads/main
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    if: vars.CLOUD_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/cloud.mjs rollback --app="${{ inputs.app }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
