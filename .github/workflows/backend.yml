name: Backend pipeline
on:
  push:
    branches: [main]
    paths: ['server/**', 'package*.json', 'scripts/cloud.mjs', 'tests/api.test.mjs', '.github/workflows/backend.yml']
  pull_request:
    paths: ['server/**', 'package*.json', 'tests/api.test.mjs', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Worker bundle
        run: npx wrangler deploy server/worker.mjs --name fieldwork-api --compatibility-date 2026-10-01 --dry-run --outdir .artifacts/backend
      - name: Browser regression checks with released frontends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/ci-baseline.mjs
          npm run test:e2e
      - name: Package backend source for desktop updates
        run: |
          mkdir -p .artifacts/backend-release
          git archive --format=tar.gz --output=.artifacts/backend-release/backend.tar.gz HEAD server scripts/lib.mjs
          cd .artifacts/backend-release
          sha256sum backend.tar.gz > backend.sha256
      - name: Publish backend release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "backend-${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" .artifacts/backend-release/* --target "$GITHUB_SHA" --title "Backend ${GITHUB_SHA:0:12}" --notes 'Backend source and database migrations. See docs/DEPLOYMENT.md for desktop upgrade and rollback.'
      - name: Apply additive migrations and deploy API only
        if: github.event_name != 'pull_request' && vars.CLOUD_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: node scripts/cloud.mjs deploy --app=backend --version="${GITHUB_SHA:0:12}"
