name: Reusable frontend release
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Select immutable release ID
        run: echo "VERSION=${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build only this application's release artifact
        run: node scripts/build.mjs --app="$APP" --version="$VERSION"
      - name: Assemble integration environment from published sibling releases
        run: node scripts/ci-baseline.mjs
      - name: Stage candidate without promoting it
        run: node --input-type=module -e 'import {stage} from "./scripts/lib.mjs"; await stage(process.env.APP,process.env.VERSION)'
      - name: Promote shell candidate in isolated test environment
        if: inputs.app == 'shell'
        run: node --input-type=module -e 'import {promote} from "./scripts/lib.mjs"; await promote("shell",process.env.VERSION)'
      - name: Browser integration tests against real API and database
        env:
          CANDIDATE: ${{ inputs.app }}:${{ env.VERSION }}
        run: npm run test:e2e
      - name: Package exact tested artifact and checksum
        run: node scripts/package.mjs --app="$APP" --version="$VERSION"
      - name: Publish immutable GitHub release
        if: github.event_name != 'pull_request'
        run: gh release create "$APP-$VERSION" ".artifacts/packages/$APP/$VERSION/$APP.tar.gz" ".artifacts/packages/$APP/$VERSION/$APP.sha256" --target "$GITHUB_SHA" --title "$APP $VERSION" --notes "Independently built and browser-tested $APP release. Commit $GITHUB_SHA."
      - name: Deploy and promote to Cloudflare
        if: github.event_name != 'pull_request' && vars.CLOUD_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: node scripts/cloud.mjs deploy --app="$APP" --version="$VERSION"
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.app }}
          path: test-results/
          retention-days: 7
