name: Promote to production

on:
  workflow_dispatch:
    inputs:
      app:
        description: App whose preview you reviewed
        required: true
        type: choice
        options: [shell, catalog, orders]
      preview_run_id:
        description: 'Run ID from that app’s successful Deploy preview workflow'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-${{ inputs.app }}-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote reviewed ${{ inputs.app }} deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP: ${{ inputs.app }}
      PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Select the successful preview bundle
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PREVIEW_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/runs/$PREVIEW_RUN_ID" | jq -er --arg app "$APP" '
            select(.path == (".github/workflows/deploy-" + $app + ".yml")
              and .event == "workflow_dispatch" and .head_branch == "main"
              and .status == "completed" and .conclusion == "success") |
            "artifact=\($app)-preview-\(.id)-\(.run_attempt)"
          ' >> "$GITHUB_OUTPUT"

      - name: Download the frozen preview bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.preview.outputs.artifact }}
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
          path: bundle

      - name: Verify and extract the reviewed files
        id: source
        run: |
          cd bundle
          jq -e --arg app "$APP" --arg run "$PREVIEW_RUN_ID" '
            .app == $app and .previewRunId == $run
          ' deployment.json
          printf '%s  %s\n' "$(jq -r .sha256 deployment.json)" deployment.tar.gz | sha256sum --check
          mkdir ../app-dist
          tar -xzf deployment.tar.gz -C ../app-dist
          echo "commit=$(jq -er .commit deployment.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for the deployment CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Publish the reviewed files to production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          npx --yes wrangler@4.136.3 pages deploy app-dist \
            --project-name="microfrontend-lab-$APP" --branch=main --commit-hash="$SOURCE_COMMIT"

      - name: Record promotion
        run: |
          {
            echo "### $APP production promotion"
            echo "URL: https://microfrontend-lab-$APP.pages.dev"
            echo "Reviewed preview run: https://github.com/$GH_REPO/actions/runs/$PREVIEW_RUN_ID"
            cat bundle/deployment.json
          } >> "$GITHUB_STEP_SUMMARY"
