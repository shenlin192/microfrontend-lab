name: Promote to production

on:
  workflow_dispatch:
    inputs:
      app:
        description: App whose preview you reviewed
        required: true
        type: choice
        options: [shell, catalog, orders]
      version:
        description: 'Release version you reviewed, for example 1.0.2 (without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.app }}-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote reviewed ${{ inputs.app }} deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the release you reviewed
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a published version such as 1.0.2, without v."
            exit 1
          fi
          TAG="$APP/v$VERSION"
          gh api "repos/$GH_REPO/releases/tags/$TAG" | jq -e '
            .draft == false and .prerelease == false and .immutable == true
          '
          gh release download "$TAG" --pattern "$APP.tar.gz" --pattern release.json --dir release
          if [ "$APP" = shell ] && ! jq -e '.remotes.catalog.version and .remotes.orders.version' release/release.json; then
            echo "Use shell 1.0.2 or newer: older releases do not freeze their remote configuration."
            exit 1
          fi
          COMMIT=$(jq -er '.commit' release/release.json)
          cd release
          printf '%s  %s\n' "$(jq -r .sha256 release.json)" "$APP.tar.gz" | sha256sum --check
          mkdir ../app-dist
          tar -xzf "$APP.tar.gz" -C ../app-dist
          cp release.json ../app-dist/release.json
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Confirm this exact release was deployed to preview
        run: |
          PREVIEW_URL="https://v${VERSION//./-}.microfrontend-lab-$APP.pages.dev"
          if ! curl -fsS "$PREVIEW_URL/release.json" -o preview-release.json || \
             ! cmp -s release/release.json preview-release.json; then
            echo "Deploy $APP $VERSION to preview and review it before promoting."
            exit 1
          fi

      - name: Set up Node.js for the deployment CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Publish the reviewed files to production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          npx --yes wrangler@4.136.3 pages deploy app-dist \
            --project-name="microfrontend-lab-$APP" --branch=main --commit-hash="$SOURCE_COMMIT"

      - name: Record promotion
        run: |
          {
            echo "### $APP production promotion"
            echo "URL: https://microfrontend-lab-$APP.pages.dev"
            echo "Release: https://github.com/$GH_REPO/releases/tag/$APP/v$VERSION"
            echo "Preview: https://v${VERSION//./-}.microfrontend-lab-$APP.pages.dev"
            cat release/release.json
          } >> "$GITHUB_STEP_SUMMARY"
